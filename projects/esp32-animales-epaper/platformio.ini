; PlatformIO Project Configuration File for Waveshare ESP32-S3-ePaper-1.54
; Proyecto: Libro de Animales Interactivo (1-bit e-Paper + ES8311 Audio)
; Target: ESP32-S3 (ESP32-S3-PICO-1-N8R8), 8MB Flash, 8MB PSRAM (OPI)

[platformio]
default_envs = esp32-s3-paper

[env:esp32-s3-paper]
platform = espressif32 @ ~6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; Target MCU Configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = partitions_animales_8MB.csv
board_build.filesystem = littlefs

; PSRAM Configuration (Octal PSRAM support for ESP32-S3-N8R8)
board_build.arduino.memory_type = qio_opi

; Compiler and Preprocessor Flags
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=1
    -I include

; Upload & Monitor Settings
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; Entorno OTA inalambrico (cuando el ESP32 ya esta desconectado del USB)
[env:esp32-s3-paper-ota]
extends = env:esp32-s3-paper
upload_protocol = espota
upload_port = esp32-animales.local

; Descomentar para ejecutar tests unitarios de logica en entorno nativo (si hay g++)
; [env:native]
; platform = native
; build_flags = -std=c++17 -I include -DUNIT_TEST_HOST
