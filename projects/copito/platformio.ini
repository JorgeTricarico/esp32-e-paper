; PlatformIO Project Configuration File for Waveshare ESP32-S3-ePaper-1.54
; Target: ESP32-S3 (ESP32-S3FH4R2 / ESP32-S3-PICO-1), 16MB Flash, 8MB PSRAM (OPI)

[platformio]
default_envs = esp32-s3-paper

[env:esp32-s3-paper]
platform = espressif32 @ ~6.6.0
board = esp32-s3-devkitc-1
framework = arduino

; Target MCU Configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; PSRAM Configuration (Octal PSRAM support for ESP32-S3)
board_build.arduino.memory_type = qio_opi

; Compiler and Preprocessor Flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=1
    -I include

; Required Libraries
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4

; Upload & Monitor Settings
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
